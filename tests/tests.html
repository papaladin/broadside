<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broadside — Test Suite</title>
  <style>
    :root {
      --bg:           #0d1520;
      --panel:        #131f2e;
      --panel-alt:    #1a2a3a;
      --border:       #2a3f52;
      --border-faint: #1e2e3e;
      --text:         #c4b896;
      --text-dim:     #8a7a60;
      --text-faint:   #5a4a38;
      --gold:         #c9a84c;
      --gold-br:      #e8c870;
      --green:        #5aaa5a;
      --red:          #cc6060;
      --amber:        #c89040;
      --font:         'Courier New', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font);
           font-size: 12px; padding: 16px; line-height: 1.5; }

    h1 { color: var(--gold-br); font-size: 16px; letter-spacing: 1px; margin-bottom: 4px; }
    .subtitle { color: var(--text-dim); font-size: 11px; margin-bottom: 14px; }

    /* Summary bar */
    .summary { display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
               background: var(--panel); border: 1px solid var(--border);
               padding: 10px 14px; margin-bottom: 12px; }
    .stat-label { color: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--gold-br); }
    .stat-value.green  { color: var(--green); }
    .stat-value.red    { color: var(--red); }
    .stat-value.amber  { color: var(--amber); }

    /* Toolbar */
    #toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    button   { background: var(--panel-alt); color: var(--gold); border: 1px solid var(--border);
               padding: 5px 12px; font-family: var(--font); font-size: 12px; cursor: pointer; min-height: 30px; }
    button:hover { background: var(--gold); color: var(--bg); }
    button.active { border-color: var(--gold-br); color: var(--gold-br); background: var(--panel); }
    #copy-btn   { border-color: var(--red); color: var(--red); display: none; }
    #copy-btn:hover { background: var(--red); color: #fff; }
    #copy-msg   { color: var(--green); font-size: 11px; display: none; }

    /* Suite groups */
    .suite { background: var(--panel); border: 1px solid var(--border-faint);
             padding: 10px 14px; margin-bottom: 8px; }
    .suite h2 { color: var(--gold); font-size: 12px; letter-spacing: 0.5px;
                border-bottom: 1px solid var(--border-faint); padding-bottom: 4px; margin-bottom: 6px; }

    /* Individual test rows */
    .test { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
    .test-id   { color: var(--text-faint); font-size: 10px; min-width: 80px; flex-shrink: 0; }
    .test-name { color: var(--text); }
    .test.fail .test-name { color: var(--red); }
    .test.skip .test-name { color: var(--text-faint); font-style: italic; }
    .test-icon { font-size: 11px; flex-shrink: 0; }
    .test-err  { color: var(--amber); font-size: 11px; margin-left: 4px; font-style: italic; }

    .running { color: var(--text-dim); font-style: italic; padding: 8px 0; }
    .footer  { color: var(--text-faint); font-size: 10px; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <h1>⚓ Broadside — Test Suite</h1>
  <div class="subtitle">Unit tests (logic), reducer tests (engine), smoke tests (UI). No browser storage or RNG side effects leak between tests.</div>

  <div class="summary">
    <div><div class="stat-label">Total</div><div class="stat-value" id="total">—</div></div>
    <div><div class="stat-label">Passed</div><div class="stat-value green" id="passed">—</div></div>
    <div><div class="stat-label">Failed</div><div class="stat-value red" id="failed">—</div></div>
    <div><div class="stat-label">Status</div><div class="stat-value" id="status">—</div></div>
  </div>

  <div id="toolbar">
    <button class="active" data-filter="all">All</button>
    <button data-filter="L">Logic</button>
    <button data-filter="G">Generator</button>
    <button data-filter="E">Engine</button>
    <button data-filter="U">UI</button>
    <button data-filter="R">Robustness</button>
    <button onclick="location.reload()">↻ Re-run</button>
    <button id="copy-btn">📋 Copy failures</button>
    <span id="copy-msg">Copied!</span>
  </div>

  <div id="suites"><div class="running">Loading game scripts and running tests…</div></div>
  <div class="footer">Tests run automatically once all Babel JSX files are transpiled.</div>

  <!-- ── React & Babel ──────────────────────────────────────────────────── -->
  <!-- Use development builds so React error messages are readable -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/fast-check@3.13.0/dist/fast-check.umd.js"></script>

  <!-- ── Game scripts — plain JS files (no Babel needed) ───────────────── -->
  <script src="../data.js"></script>
  <script src="../data_text.js"></script>
  <script src="../ship-sprite.js"></script>
  <script src="../logic.js"></script>
  <script src="../storage.js"></script>
  <script src="../generators.js"></script>
  <script src="../engine_core.js"></script>
  <script src="../engine_port.js"></script>
  <script src="../engine_voyage.js"></script>
  <script src="../engine_combat.js"></script>
  <script src="../engine_onboarding.js"></script>
  <script src="../engine_career.js"></script>
  <script src="../engine_scripted.js"></script>

  <!-- ── Game scripts — JSX files (Babel required) ─────────────────────── -->
  <!-- Note: App.jsx is intentionally excluded — it renders the game into
       the page, which is not needed for unit or smoke tests. -->
  <script type="text/babel" data-presets="react" src="../ui.jsx"></script>
  <script type="text/babel" data-presets="react" src="../icons.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_core.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_port.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_shipyard.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_crew.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_market.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_voyage.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_combat.jsx"></script>
  <script type="text/babel" data-presets="react" src="../screens_menu.jsx"></script>

  <!-- ── Test files (plain JS — no JSX, no Babel) ──────────────────────── -->
  <!-- Each file pushes {id, name, run} objects onto window._tests. -->
  <!-- Tests are not executed at load time — the runner below runs them. -->
  <script>window._tests = [];</script>
  <script src="tests_helpers.js"></script>
  <script src="tests_logic.js"></script>
  <script src="tests_generators.js"></script>
  <script src="tests_engine.js"></script>
  <script src="tests_ui.js"></script>
  <script src="tests_robustness.js"></script>

  <!-- ── Runner ────────────────────────────────────────────────────────── -->
  <script>
  (function () {
    "use strict";

    // ── localStorage isolation ──────────────────────────────────────────
    // Each test runs against a fresh in-memory store so save/load tests
    // cannot pollute each other or the real browser storage.
    const _realLS = window.localStorage;
    let _store = {};
    const _mockLS = {
      getItem:    (k)    => (_store[k] !== undefined ? _store[k] : null),
      setItem:    (k, v) => { _store[k] = String(v); },
      removeItem: (k)    => { delete _store[k]; },
      clear:      ()     => { _store = {}; },
    };

    function installMockLS () {
      try { Object.defineProperty(window, "localStorage", { value: _mockLS, writable: true, configurable: true }); }
      catch (e) { window.localStorage = _mockLS; }
    }
    function restoreRealLS () {
      try { Object.defineProperty(window, "localStorage", { value: _realLS, writable: true, configurable: true }); }
      catch (e) { window.localStorage = _realLS; }
    }
    function clearStore () { _store = {}; }

    // ── RNG stub (mirrors the one in tests_helpers.js — kept independent
    //    so the runner can always reset it regardless of test outcome) ───
    const _realRandom = Math.random;
    function resetRandom () { Math.random = _realRandom; }

    // ── Assertion utilities (passed as `u` to every test) ───────────────
    const makeU = () => ({
      assert: (cond, msg) => {
        if (!cond) throw new Error(msg || "Assertion failed");
      },
      assertEqual: (actual, expected, msg) => {
        if (actual !== expected)
          throw new Error(msg || `Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      },
      assertApprox: (actual, expected, tolerance = 0.001, msg) => {
        if (Math.abs(actual - expected) > tolerance)
          throw new Error(msg || `Expected ≈${expected} (±${tolerance}), got ${actual}`);
      },
      assertThrows: (fn, msg) => {
        let threw = false;
        try { fn(); } catch (e) { threw = true; }
        if (!threw) throw new Error(msg || "Expected function to throw but it did not");
      },
    });

    // ── Group tests by prefix (L. E. U.) ────────────────────────────────
    const GROUPS = {
      "L": "Logic Tests (pure functions)",
      "E": "Engine Tests (reducers)",
      "U": "UI Tests (namespace + smoke renders)",
    };
    const OTHER_GROUP = "Other Tests";

    function groupTests(tests) {
      const grouped = {};
      for (const t of tests) {
        const prefix = t.id ? t.id.split(".")[0] : "?";
        const groupName = GROUPS[prefix] || OTHER_GROUP;
        if (!grouped[groupName]) grouped[groupName] = [];
        grouped[groupName].push(t);
      }
      return grouped;
    }

    // ── Run all tests ────────────────────────────────────────────────────
    let _results = [];

    function runAll() {
      _results = [];
      const u = makeU();

      for (const test of window._tests) {
        let ok = true, err = null;
        // Isolate: fresh mock localStorage, restored RNG
        clearStore();
        installMockLS();
        resetRandom();

        try {
          test.run(u);
        } catch (e) {
          ok = false;
          err = e.message || String(e);
        } finally {
          resetRandom();
          restoreRealLS();
        }

        _results.push({ id: test.id, name: test.name, ok, err });
      }

      render("all");
    }

    // ── Render results ───────────────────────────────────────────────────
    function render(activeFilter) {
      const root = document.getElementById("suites");
      root.innerHTML = "";

      const filtered = activeFilter === "all"
        ? _results
        : _results.filter(r => r.id && r.id.startsWith(activeFilter + "."));

      const grouped = groupTests(filtered);
      let total = 0, passed = 0, failed = 0;
      const failures = [];

      for (const [groupName, tests] of Object.entries(grouped)) {
        const suite = document.createElement("div");
        suite.className = "suite";
        const h = document.createElement("h2");
        const groupPassed = tests.filter(t => t.ok).length;
        h.textContent = `${groupName}  (${groupPassed}/${tests.length})`;
        suite.appendChild(h);

        for (const t of tests) {
          total++;
          if (t.ok) passed++; else { failed++; failures.push(t); }

          const row = document.createElement("div");
          row.className = "test " + (t.ok ? "pass" : "fail");

          const icon = document.createElement("span");
          icon.className = "test-icon";
          icon.textContent = t.ok ? "✓" : "✗";

          const id = document.createElement("span");
          id.className = "test-id";
          id.textContent = t.id || "";

          const name = document.createElement("span");
          name.className = "test-name";
          name.textContent = t.name;

          row.appendChild(icon);
          row.appendChild(id);
          row.appendChild(name);

          if (!t.ok && t.err) {
            const errSpan = document.createElement("span");
            errSpan.className = "test-err";
            errSpan.textContent = "— " + t.err;
            row.appendChild(errSpan);
          }
          suite.appendChild(row);
        }
        root.appendChild(suite);
      }

      if (filtered.length === 0) {
        root.innerHTML = '<div class="running">No tests match the current filter.</div>';
      }

      // Update summary
      document.getElementById("total").textContent  = total;
      document.getElementById("passed").textContent = passed;
      document.getElementById("failed").textContent = failed;
      const statusEl = document.getElementById("status");
      if (failed === 0 && total > 0) {
        statusEl.textContent = "ALL GREEN"; statusEl.className = "stat-value green";
      } else if (failed > 0) {
        statusEl.textContent = `${failed} FAILED`; statusEl.className = "stat-value red";
      } else {
        statusEl.textContent = "—"; statusEl.className = "stat-value";
      }

      // Copy failures button
      const copyBtn = document.getElementById("copy-btn");
      copyBtn.style.display = failures.length > 0 ? "inline-block" : "none";
      copyBtn.onclick = () => {
        const lines = [`BROADSIDE TEST FAILURES (${failures.length})\n`];
        for (const f of failures) {
          lines.push(`[${f.id}] ${f.name}`);
          lines.push(`  Error: ${f.err}`);
          lines.push("");
        }
        navigator.clipboard.writeText(lines.join("\n")).then(() => {
          const msg = document.getElementById("copy-msg");
          msg.style.display = "inline";
          setTimeout(() => { msg.style.display = "none"; }, 2000);
        }).catch(() => alert("Clipboard write failed. Check browser permissions."));
      };
    }

    // ── Filter buttons ───────────────────────────────────────────────────
    document.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render(btn.dataset.filter);
      });
    });

    // ── Wait for all Babel JSX files then run ────────────────────────────
    // window.S.MenuModal is the last component to be registered (screens_menu.jsx).
    // Once it exists, all game modules are ready and tests can run safely.
    function waitAndRun(attempt) {
      const ready = (
        window.D && window.L && window.G && window.E &&
        window.ShipSprite &&
        window.UI && window.UI.LOG_ICONS &&
        window.S && window.S.MenuModal &&
        window._tests && window._tests.length > 0
      );

      if (ready) {
        runAll();
      } else if (attempt >= 80) {
        // Timeout — show what's missing
        const missing = [];
        if (!window.D)                 missing.push("window.D");
        if (!window.L)                 missing.push("window.L");
        if (!window.G)                 missing.push("window.G");
        if (!window.E)                 missing.push("window.E");
        if (!window.ShipSprite)        missing.push("window.ShipSprite");
        if (!window.UI)                missing.push("window.UI");
        if (!window.UI?.LOG_ICONS)     missing.push("window.UI.LOG_ICONS");
        if (!window.S)                 missing.push("window.S");
        if (!window.S?.MenuModal)      missing.push("window.S.MenuModal");
        if (!window._tests?.length)    missing.push("window._tests (test files)");
        document.getElementById("suites").innerHTML =
          `<div class="running" style="color:var(--red)">` +
          `⚠ Timed out waiting for scripts. Missing: ${missing.join(", ")}. ` +
          `Check the browser console for load errors.</div>`;
        document.getElementById("status").textContent  = "TIMEOUT";
        document.getElementById("status").className    = "stat-value red";
      } else {
        setTimeout(() => waitAndRun(attempt + 1), 100);
      }
    }

    window.addEventListener("load", () => waitAndRun(0));
  })();
  </script>
</body>
</html>

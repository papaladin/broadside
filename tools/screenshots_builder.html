<script>
function exportScene(id, fn, scale = 2) {
  const el = document.getElementById(id);
  if (!el) return;

  const imgs = el.querySelectorAll('img');
  const wait = Promise.all(Array.from(imgs).map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.onload = resolve;
      img.onerror = resolve;
    });
  }));

  wait.then(() => {
    html2canvas(el, {
      backgroundColor: null,
      scale: scale,
      useCORS: true,
      allowTaint: false,
    }).then(c => {
      const a = document.createElement("a");
      a.download = fn;
      a.href = c.toDataURL("image/png");
      a.click();
    }).catch(err => console.error("Export failed:", err));
  });
}
</script>

<script type="text/babel" data-presets="react">

  // ── SCENE E: Port (with silhouette) ─────────────────────────

  const SceneE = ({ size, sid }) => {
    const sz = size;
    const p = sz.w >= 1000 ? 14 : sz.w >= 500 ? 10 : 6;

          <div style={panelStyle({padding:p})}>
            <div style={{display:"flex", justifyContent:"space-between",
              alignItems:"flex-start", marginBottom:8}}>
              <div>
                <div style={{color:T.gold, fontSize:fs+4, fontWeight:"bold"}}>Tortuga</div>
                <div style={{color:FC.pirate.color, fontSize:fs-1, letterSpacing:"0.1em"}}>
                  PIRATE PORT
                </div>
              </div>
              <RepPill rep={82} />
            </div>
            <div style={{width:"100%",
              overflow:"hidden", borderRadius:3,
              marginBottom: p/2, lineHeight:0}}>
              <img src="../port-pirate.svg" alt="Tortuga silhouette"
                crossOrigin="anonymous"
                style={{width:"100%", height:"auto", display:"block"}} />
            </div>
            {sz.w >= 500 && (
              <p style={{color:T.textDim, fontSize:fs-1, lineHeight:1.5}}>
                A lawless haven for pirates and buccaneers.
                The most notorious port in the Caribbean.
              </p>
            )}
          </div>
          {sz.h > 350 && (
            <NarrativePanel
              title={<><IconTalking size={fs} color={T.gold} /> WORD ON THE DOCKS</>}
              variant="gossip">
              {GOSSIP.map((g, i) => <NarrativeLine key={i}>"{g}"</NarrativeLine>)}
            </NarrativePanel>
          )}
        </div>
      </SceneBox>
    );
  };

  // ── SCENE F: Crew ───────────────────────────────────────────
  const CREW_TRAIT_LABELS = {
    loyal: "Loyal Officer",
    scar_battle: "Battle Scarred",
    scar_storm: "Storm Survivor",
    scar_shipwreck: "Shipwreck Survivor",
  };

  const CREW = [
    { name:"Juan Rodríguez", faction:"spanish", role:"gunner", days:147,
      tags:["veteran","scar_battle","scar_storm","revealed_drunkard"],
      bio:"Juan is a veteran of 147 days. The crew looks up to them. They survived a deadly battle and a violent storm. Has a fondness for the bottle." },
    { name:"Katherine Brown", faction:"english", role:"navigator", days:203,
      tags:["loyal","scar_battle"],
      bio:"Katherine has served 203 days. This ship is their life now. Loyal to the ship and the captain. They will never leave." },
    { name:"Calico Rackham", faction:"pirate", role:"deckhand", days:34,
      tags:["mutineer","scar_shipwreck"],
      bio:"Calico, the Pirate deckhand, has been here 34 days. Survived a shipwreck. Was part of a mutiny once." },
    { name:"Marie Fontaine", faction:"french", role:"cook", days:88,
      tags:["seasoned","revealed_coward"],
      bio:"Marie is a seasoned hand with 88 days at sea. Not the bravest soul aboard." },
    { name:"Pieter van Dijk", faction:"dutch", role:"carpenter", days:12,
      tags:["revealed_greedy"],
      bio:"Pieter asked about the pay structure before anything else. Time will tell." },
  ];
  const tagColor = (tag) => {
    if (["loyal","veteran","seasoned"].includes(tag)) return T.greenBr;
    if (tag === "mutineer") return T.purpleBr;
    if (tag.startsWith("scar_")) return T.blueBr;
    if (tag.startsWith("revealed_")) return T.redBr;
    return T.textDim;
  };
  const tagLabelRaw = (tag) => tag.replace(/^revealed_/, "").replace(/_/g, " ");
  const SceneF = ({ size, sid }) => {
    const sz = size;
    const p = sz.w >= 1000 ? 14 : sz.w >= 500 ? 10 : 6;
    const fs = sz.w >= 1000 ? 12 : sz.w >= 500 ? 10 : 8;
    const mc = sz.h < 300 ? 3 : sz.w >= 630 ? 5 : 4;
    return (
      <SceneBox id={sid} w={sz.w} h={sz.h}>
        <div style={{padding:p, height:"100%", display:"flex",
          flexDirection:"column", gap:p/2}}>
          <div style={{color:T.gold, fontSize:fs+3, fontWeight:"bold",
            letterSpacing:"0.08em", display:"flex", alignItems:"center", gap:6}}>
            <IconCrew size={fs+4} color={T.gold} />
            CREW MANIFEST
          </div>
          <div style={{color:T.textDim, fontSize:fs-1, marginBottom:4,
            display:"flex", gap:10, flexWrap:"wrap"}}>
            {Object.entries(FC).map(([k, f]) => (
              <span key={k} style={{display:"inline-flex", alignItems:"center", gap:4}}>
                <span style={{color:f.color}}>●</span>
                {f.label}: 1
              </span>
            ))}
          </div>
          <div style={{display:"flex", flexDirection:"column",
            gap:p/2, flex:1, overflow:"hidden"}}>
            {CREW.slice(0, mc).map((c, i) => {
              const fColor = FC[c.faction]?.color || T.textDim;
              return (
                <div key={i} style={{...panelStyle({padding:p}),
                  display:"flex", gap:p, alignItems:"flex-start"}}>
                  <div style={{flexShrink:0, width: sz.w >= 500 ? 200 : 140}}>
                    <div style={{color:T.text, fontSize:fs+1, fontWeight:"bold"}}>
                      {c.name}
                    </div>
                    <div style={{color:fColor, fontSize:fs-1}}>
                      {FC[c.faction].label} {c.role} — {c.days}d
                    </div>
                    {c.tags.length > 0 && (
                      <div style={{marginTop:3, display:"flex",
                        flexWrap:"wrap", gap:3}}>
                        {c.tags.map((tag, ti) => (
                          <Pill key={ti}
                            label={CREW_TRAIT_LABELS[tag] || tagLabelRaw(tag)}
                            color={tagColor(tag)}
                            style={{fontSize:fs-3, padding:"1px 4px"}} />
                        ))}
                      </div>
                    )}
                  </div>
                  {sz.w >= 500 && (
                    <div style={{flex:1, color:T.textDim, fontSize:fs-1,
                      lineHeight:1.5, fontStyle:"italic"}}>
                      "{c.bio}"
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </SceneBox>
    );
  };

  // ── SCENE G: Random Event — Wreck (new) ─────────────────────
  const SceneG = ({ size, sid }) => {
    const sz = size;
    const p = sz.w >= 1000 ? 14 : sz.w >= 500 ? 10 : 6;
    const fs = sz.w >= 1000 ? 13 : sz.w >= 500 ? 11 : 9;
    return (
      <SceneBox id={sid} w={sz.w} h={sz.h}>
        <div style={{padding:p, height:"100%", display:"flex",
          flexDirection:"column", gap:p/2, overflow:"hidden"}}>
          <div style={{display:"flex", justifyContent:"space-between",
            alignItems:"center", marginBottom:4}}>
            <Pill label="Choice" color={T.gold} />
            <span style={{color:T.textDim, fontSize:fs-2}}>Day 23</span>
          </div>
          <div style={{color:T.gold, fontSize:fs+3, fontWeight:"bold"}}>Drifting Wreck</div>

          {/* SVG illustration: preserve the full artwork instead of cropping it. */}
          <div style={{width:"100%", display:"flex", justifyContent:"center", alignItems:"center",
            borderRadius:4, background:"#0d1824", border:`1px solid ${T.borderFaint}`, marginBottom:4,
            padding:4, overflow:"hidden", maxHeight:sz.h*0.42}}>
            <img src="../event-wreck.svg" alt="Wreck" crossOrigin="anonymous"
              style={{width:"auto", maxWidth:"100%", height:"auto", maxHeight:sz.h*0.38, display:"block", objectFit:"contain"}} />
          </div>

          <p style={{color:T.text, fontSize:fs, lineHeight:1.5, marginBottom:4}}>
            A damaged ship drifts in the current, hull split and sails in tatters.
            You spot a wreck adrift:  broken masts, silent decks.
          </p>

          {/* Choices */}
          {sz.w >= 500 && (
            <div style={{display:"flex", flexDirection:"column", gap:6}}>
              <div style={panelStyle({background:T.panelAlt, padding:8})}>
                <div style={{color:T.text, fontSize:fs, fontWeight:"bold"}}>Search the wreck (risky)</div>
                <div style={{color:T.textDim, fontSize:fs-2}}>You bring your ship alongside and send a party aboard...</div>
              </div>
              <div style={panelStyle({background:T.panelAlt, padding:8})}>
                <div style={{color:T.text, fontSize:fs, fontWeight:"bold"}}>Leave it be</div>
                <div style={{color:T.textDim, fontSize:fs-2}}>You leave the wreck to the mercy of the sea. The crew watches it drift past in silence.</div>
              </div>
            </div>
          )}
        </div>
      </SceneBox>
    );
  };

  // ── SCENE H: itch.io Assets ─────────────────────────────────
  const SceneHBanner = ({ sid }) => (
    <SceneBox id={sid} w={960} h={480}>
      <svg style={{position:"absolute", inset:0, width:"100%", height:"100%", opacity:0.04}}
           viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
        <path d="M50,80 Q80,60 120,70 T180,65 Q200,60 220,68 T280,62 Q310,55 340,65 T380,70"
              fill="none" stroke={T.gold} strokeWidth="1.5" />
        <path d="M60,100 Q90,90 130,95 T190,88 Q220,85 250,92 T310,87 Q340,82 370,90"
              fill="none" stroke={T.gold} strokeWidth="1" />
      </svg>
      <div style={{position:"absolute", inset:8, border:`1px solid ${T.border}`, borderRadius:4}} />
      <div style={{position:"absolute", inset:0, display:"flex",
        flexDirection:"column", alignItems:"center", justifyContent:"center", zIndex:1}}>
        <div style={{marginBottom:10}}><IconAnchor size={50} color={T.gold} /></div>
        <div style={{color:T.gold, fontSize:42, fontWeight:"bold",
          letterSpacing:"0.2em", textShadow:`0 0 30px ${T.goldDim}`}}>BROADSIDE</div>
        <div style={{color:T.textDim, fontSize:18, letterSpacing:"0.15em",
          marginTop:8}}>CARIBBEAN · 1695</div>
        <div style={{color:T.textFaint, fontSize:12, marginTop:14, fontStyle:"italic"}}>
          A turn-based, narrative pirate strategy game
        </div>
      </div>
      <div style={{position:"absolute", bottom:14, left:0, right:0,
        display:"flex", gap:6, justifyContent:"center", zIndex:1}}>
        {Object.values(FC).map((f, i) => (
          <div key={i} style={{width:6, height:6, borderRadius:"50%",
            background:f.color, opacity:0.6}} />
        ))}
      </div>
    </SceneBox>
  );

  const SceneHBackground = ({ sid }) => (
    <SceneBox id={sid} w={1920} h={1080}>
      <svg style={{position:"absolute", inset:0, width:"100%", height:"100%", opacity:0.03}}
           viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
        <path d="M50,80 Q80,60 120,70 T180,65 Q200,60 220,68 T280,62 Q310,55 340,65 T380,70"
              fill="none" stroke={T.gold} strokeWidth="1.5" />
        <path d="M60,100 Q90,90 130,95 T190,88 Q220,85 250,92 T310,87 Q340,82 370,90"
              fill="none" stroke={T.gold} strokeWidth="1" />
        <ellipse cx="160" cy="90" rx="8" ry="4" fill={T.gold} opacity="0.3" />
        <ellipse cx="250" cy="78" rx="12" ry="5" fill={T.gold} opacity="0.2" />
      </svg>
    </SceneBox>
  );

  const SceneHEmbed = ({ sid }) => (
    <SceneBox id={sid} w={640} h={480}>
      <svg style={{position:"absolute", inset:0, width:"100%", height:"100%", opacity:0.04}}
           viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
        <path d="M50,80 Q80,60 120,70 T180,65 Q200,60 220,68 T280,62 Q310,55 340,65 T380,70"
              fill="none" stroke={T.gold} strokeWidth="1.5" />
        <path d="M60,100 Q90,90 130,95 T190,88" fill="none" stroke={T.gold} strokeWidth="1" />
      </svg>
      <div style={{position:"absolute", inset:8, border:`1px solid ${T.border}`, borderRadius:4}} />
      <div style={{position:"absolute", inset:0, display:"flex",
        flexDirection:"column", alignItems:"center", justifyContent:"center", zIndex:1}}>
        <div style={{marginBottom:10}}><IconAnchor size={44} color={T.gold} /></div>
        <div style={{color:T.gold, fontSize:36, fontWeight:"bold",
          letterSpacing:"0.2em", textShadow:`0 0 30px ${T.goldDim}`}}>BROADSIDE</div>
        <div style={{color:T.textDim, fontSize:15, letterSpacing:"0.15em",
          marginTop:6}}>CARIBBEAN · 1695</div>
        <div style={{color:T.textFaint, fontSize:10, marginTop:12, fontStyle:"italic"}}>
          A turn-based, narrative pirate strategy game
        </div>
      </div>
      <div style={{position:"absolute", bottom:12, left:0, right:0,
        display:"flex", gap:5, justifyContent:"center", zIndex:1}}>
        {Object.values(FC).map((f, i) => (
          <div key={i} style={{width:5, height:5, borderRadius:"50%",
            background:f.color, opacity:0.6}} />
        ))}
      </div>
    </SceneBox>
  );

  // ── SCENE I: PWA Assets ───────────────────────────────────────
  // Square icons reuse the Cover's visual language but remove the title text:
  // centered glowing anchor, dark-blue/wave background, five faction dots.
  const PwaIcon = ({ size, sid }) => {
    const n = size.w;
    const anchor = Math.round(n * 0.58);
    const dot = Math.max(7, Math.round(n * 0.035));
    const gap = Math.max(5, Math.round(n * 0.018));
    return (
      <SceneBox id={sid} w={n} h={n}>
        <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.12}}
             viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
          <path d="M0,245 Q45,215 90,235 T180,225 Q230,210 285,230 T400,220" fill="none" stroke={T.gold} strokeWidth="3" />
          <path d="M0,285 Q55,260 110,278 T220,270 Q285,250 340,275 T400,265" fill="none" stroke={T.gold} strokeWidth="2" />
          <path d="M0,325 Q55,300 120,320 T245,312 Q315,292 400,315" fill="none" stroke={T.gold} strokeWidth="1.5" />
        </svg>
        <div style={{position:"absolute",inset:Math.max(8,n*.018),border:`1px solid ${T.border}`,borderRadius:Math.max(3,n*.012)}} />
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:n*.06}}>
          <div className="pwa-anchor-glow" style={{lineHeight:0,marginBottom:n*.055}}>
            <IconAnchor size={anchor} color={T.gold} />
          </div>
          <div style={{display:"flex",gap,justifyContent:"center",alignItems:"center"}}>
            {Object.values(FC).map((f,i)=><div key={i} style={{width:dot,height:dot,borderRadius:"50%",background:f.color,opacity:.85}} />)}
          </div>
        </div>
      </SceneBox>
    );
  };

  // iOS splash: same Cover composition, enlarged to the device portrait aspect ratio.
  // The content remains centered and the background fills the whole screen.
  const PwaSplash = ({ size, sid }) => {
    const n = size;
    const ts = Math.round(n.w * 0.075);
    const ss = Math.round(n.w * 0.028);
    const an = Math.round(n.w * 0.14);
    const dot = Math.max(8, Math.round(n.w * 0.012));
    const gap = Math.max(8, Math.round(n.w * 0.014));
    return (
      <SceneBox id={sid} w={n.w} h={n.h}>
        <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.055}}
             viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
          <path d="M0,480 Q45,430 90,455 T180,445 Q230,420 285,450 T400,440" fill="none" stroke={T.gold} strokeWidth="3" />
          <path d="M0,555 Q55,515 110,540 T220,530 Q285,500 340,535 T400,520" fill="none" stroke={T.gold} strokeWidth="2" />
          <path d="M0,635 Q55,600 120,625 T245,615 Q315,590 400,620" fill="none" stroke={T.gold} strokeWidth="1.5" />
        </svg>
        <div style={{position:"absolute",inset:Math.max(10,n.w*.018),border:`1px solid ${T.border}`,borderRadius:4}} />
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div className="pwa-anchor-glow" style={{lineHeight:0,marginBottom:n.h*.018}}><IconAnchor size={an} color={T.gold} /></div>
          <div style={{color:T.gold,fontSize:ts,fontWeight:"bold",letterSpacing:"0.2em",textShadow:`0 0 30px ${T.goldDim}`}}>BROADSIDE</div>
          <div style={{color:T.textDim,fontSize:ss,letterSpacing:"0.15em",marginTop:n.h*.012}}>CARIBBEAN · 1695</div>
          <div style={{color:T.textFaint,fontSize:Math.round(ss*.72),marginTop:n.h*.02,fontStyle:"italic"}}>A turn-based, narrative pirate strategy game</div>
          <div style={{display:"flex",gap,marginTop:n.h*.025}}>
            {Object.values(FC).map((f,i)=><div key={i} style={{width:dot,height:dot,borderRadius:"50%",background:f.color,opacity:.75}} />)}
          </div>
        </div>
      </SceneBox>
  );
  };

 const SizeBlock = ({ label, exportName, sid, children, scale }) => (
  <div className="size-block">
    <div className="size-label">{label}</div>
    {children}
    <button className="export-btn" onClick={() => exportScene(sid, exportName, scale)}>
      Export {label}
    </button>
  </div>
);

  const Page = () => (
    <>
      <div id="sceneA">
        <SectionHeader>Scene A — Cover</SectionHeader>
        {SIZES.map((sz, i) => (
          <SizeBlock key={i} label={sz.l} sid={`sA${i}`}
            exportName={`broadside-cover-${sz.l}.png`}>
            <SceneA size={sz} sid={`sA${i}`} />
          </SizeBlock>
        ))}
      </div>

      <div id="sceneB">
        <SectionHeader>Scene B — Captain's Log</SectionHeader>
        {SIZES.map((sz, i) => (
          <SizeBlock key={i} label={sz.l} sid={`sB${i}`}
            exportName={`broadside-log-${sz.l}.png`}>
            <SceneB size={sz} sid={`sB${i}`} />
          </SizeBlock>
        ))}
      </div>

      <div id="sceneC">
        <SectionHeader>Scene C — Naval Combat (with distance indicator)</SectionHeader>
        {SIZES.map((sz, i) => (
          <SizeBlock key={i} label={sz.l} sid={`sC${i}`}
            exportName={`broadside-combat-${sz.l}.png`}>
            <SceneC size={sz} sid={`sC${i}`} />
          </SizeBlock>
        ))}
      </div>

      <div id="sceneD">
        <SectionHeader>Scene D — Boarding Combat</SectionHeader>
        {SIZES.map((sz, i) => (
          <SizeBlock key={i} label={sz.l} sid={`sD${i}`}
            exportName={`broadside-boarding-${sz.l}.png`}>
            <SceneD size={sz} sid={`sD${i}`} />
          </SizeBlock>
        ))}
      </div>

      <div id="sceneE">
        <SectionHeader>Scene E — Port (with silhouette)</SectionHeader>
        {SIZES.map((sz, i) => (
          <SizeBlock key={i} label={sz.l} sid={`sE${i}`}
            exportName={`broadside-port-${sz.l}.png`}>
            <SceneE size={sz} sid={`sE${i}`} />
          </SizeBlock>
        ))}
      </div>

      <div id="sceneF">
        <SectionHeader>Scene F — Crew</SectionHeader>
        {SIZES.map((sz, i) => (
          <SizeBlock key={i} label={sz.l} sid={`sF${i}`}
            exportName={`broadside-crew-${sz.l}.png`}>
            <SceneF size={sz} sid={`sF${i}`} />
          </SizeBlock>
        ))}
      </div>

      <div id="sceneG">
        <SectionHeader>Scene G — Random Event: Drifting Wreck</SectionHeader>
        {SIZES.map((sz, i) => (
          <SizeBlock key={i} label={sz.l} sid={`sG${i}`}
            exportName={`broadside-event-wreck-${sz.l}.png`}>
            <SceneG size={sz} sid={`sG${i}`} />
          </SizeBlock>
        ))}
      </div>

      <div id="sceneH">
        <SectionHeader>Scene H — itch.io Page Assets</SectionHeader>
        <SizeBlock label="Banner 960×480" sid="sH0"
          exportName="broadside-banner-960x480.png">
          <SceneHBanner sid="sH0" />
        </SizeBlock>
        <SizeBlock label="Background 1920×1080" sid="sH1"
          exportName="broadside-background-1920x1080.png">
          <SceneHBackground sid="sH1" />
        </SizeBlock>
        <SizeBlock label="Embed BG 640×480" sid="sH2"
          exportName="broadside-embed-640x480.png">
          <SceneHEmbed sid="sH2" />
        </SizeBlock>
      </div>

      <div id="sceneI">
        <SectionHeader>Scene I — PWA Assets</SectionHeader>
        <div style={{color:T.textDim,fontSize:11,marginBottom:12,maxWidth:900,lineHeight:1.5}}>
          Square icons use the Cover palette and waves with a large glowing anchor. Splash exports use the Cover composition in portrait device proportions.
        </div>
        <div style={{display:"flex",flexWrap:"wrap",alignItems:"flex-start"}}>
          <SizeBlock label="192×192 icon" sid="sI192" exportName="icon-192x192.png" scale={1}>
            <PwaIcon size={{w:192,h:192}} sid="sI192" />
          </SizeBlock>
          <SizeBlock label="512×512 icon" sid="sI512" exportName="icon-512x512.png" scale={1}>
            <PwaIcon size={{w:512,h:512}} sid="sI512" />
          </SizeBlock>
          <SizeBlock label="1024×1024 source icon" sid="sI1024" exportName="icon-1024x1024.png" scale={1}>
            <PwaIcon size={{w:1024,h:1024}} sid="sI1024" />
          </SizeBlock>
          <SizeBlock label="180×180 Apple touch icon" sid="sIApple" exportName="apple-touch-icon.png" scale={1}>
            <PwaIcon size={{w:180,h:180}} sid="sIApple" />
          </SizeBlock>
        </div>
        <div style={{marginTop:18}}>
          <div className="size-label" style={{marginBottom:8}}>iOS portrait launch screens</div>
          <SizeBlock label="1290×2796" sid="sISplash1290" exportName="apple-splash-1290x2796.png">
            <PwaSplash size={{w:1290,h:2796}} sid="sISplash1290" />
          </SizeBlock>
          <SizeBlock label="1179×2556" sid="sISplash1179" exportName="apple-splash-1179x2556.png">
            <PwaSplash size={{w:1179,h:2556}} sid="sISplash1179" />
          </SizeBlock>
        </div>
      </div>

    </>
  );

  ReactDOM.createRoot(document.getElementById('scenes-root'))
    .render(<Page />);
});
</script>

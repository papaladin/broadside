<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broadside — Results to Markdown</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a141e; color: #e0e0e0; font-family: 'Courier New', monospace; padding: 20px; }
  h1 { color: #ffd700; }
  .tool-section { border: 1px solid #2a3a4a; margin: 20px 0; padding: 10px; }
  .tool-title { color: #ffd700; font-size: 14px; margin-bottom: 10px; }
  iframe { width: 100%; height: 500px; border: 1px solid #2a3a4a; }
  button { background: #cc9900; border: 1px solid #ffd700; color: #000; padding: 8px 16px; cursor: pointer; margin: 5px; }
  #status { margin: 10px 0; }
  #md-output { width: 100%; height: 300px; background: #0d1620; border: 1px solid #2a3a4a; color: #e0e0e0; font-family: inherit; padding: 10px; }
</style>
</head>
<body>
  <h1>⚓ Broadside — Results Aggregator</h1>
  <p>This page loads each simulator, runs them, and collects the results into a Markdown file you can download.</p>
  <button onclick="collectAll()">🔄 Collect All Results</button>
  <button onclick="downloadMD()">⬇️ Download Markdown</button>
  <div id="status">Ready.</div>

  <!-- Each tool is loaded in an iframe -->
  <div class="tool-section" id="sec-carreer">
    <div class="tool-title">Career Simulator</div>
    <iframe id="frame-carreer" src="sim-carreerV1.html"></iframe>
  </div>
  <div class="tool-section" id="sec-bio">
    <div class="tool-title">Bio & Log Analyzer</div>
    <iframe id="frame-bio" src="sim-crew.html"></iframe>
  </div>
  <div class="tool-section" id="sec-bio">
    <div class="tool-title">Bio & Log Analyzer</div>
    <iframe id="frame-bio" src="sim-crewbio.html"></iframe>
  </div>
  <div class="tool-section" id="sec-ai">
    <div class="tool-title">Combat AI Simulator</div>
    <iframe id="frame-ai" src="sim-combatAI.html"></iframe>
  </div>
  <div class="tool-section" id="sec-balance">
    <div class="tool-title">Balance Dashboard</div>
    <iframe id="frame-balance" src="tools-balance.html"></iframe>
  </div>
  <div class="tool-section" id="sec-balance">
    <div class="tool-title">Balance Dashboard</div>
    <iframe id="frame-balance" src="sim-equipment.html"></iframe>
  </div>
  <!-- Add more tools as needed -->

  <h2>Generated Markdown Preview</h2>
  <textarea id="md-output" readonly placeholder="Results will appear here..."></textarea>

  <script>
    // ── Tool Configuration ─────────────────────────────────────────
    // For each iframe: id, list of result container IDs to extract,
    // and the JS function(s) to click/run (if any).
    const tools = [
      {
        iframe: 'frame-carreer',
        containers: ['compTable', 'shipMilestones', 'softlockTable', 'engagementTable', 'smuggleSweep'],
        runFn: 'runSimulation()',
        waitMs: 5000 // 5 seconds for a full run
      },
      {
        iframe: 'frame-bio',
        containers: ['bioResults', 'logResults'],
        runFn: 'runBioAnalysis(); setTimeout(() => runLogAnalysis(), 1500);',
        waitMs: 7000 // bio + log runs
      },
      {
        iframe: 'frame-ai',
        containers: ['presetSummary', 'verboseResults'],
        runFn: 'runAllPresets()',
        waitMs: 8000 // 500 runs * many presets
      },
      {
        iframe: 'frame-balance',
        containers: ['output'],
        runFn: null, // auto-renders on load
        waitMs: 1000
      }
    ];

    let collectedMD = '';

    async function collectAll() {
      collectedMD = '';
      document.getElementById('status').textContent = 'Collecting results...';

      for (const tool of tools) {
        const iframe = document.getElementById(tool.iframe);
        if (!iframe) continue;

        // Wait for iframe to load
        const doc = iframe.contentDocument;
        if (!doc) {
          console.warn(`Cannot access iframe ${tool.iframe} (cross-origin?)`);
          continue;
        }

        // Trigger the run function if defined
        if (tool.runFn) {
          try {
            doc.eval(tool.runFn);
            console.log(`Executed run on ${tool.iframe}`);
          } catch (e) {
            console.warn(`Could not auto-run ${tool.iframe}: ${e.message}`);
          }
        }

        // Wait for results to render
        await new Promise(r => setTimeout(r, tool.waitMs));

        // Extract text from containers
        let sectionText = `## ${tool.iframe.replace('frame-', '')}\n\n`;
        for (const cid of tool.containers) {
          const el = doc.getElementById(cid);
          if (el && el.innerText.trim()) {
            sectionText += `### From #${cid}\n\n${el.innerText}\n\n`;
          }
        }

        collectedMD += sectionText;
        document.getElementById('status').textContent = `Processed ${tool.iframe}...`;
      }

      document.getElementById('md-output').value = collectedMD;
      document.getElementById('status').textContent = 'Done. You can download the Markdown.';
    }

    function downloadMD() {
      const blob = new Blob([collectedMD], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'broadside_results.md';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
